# Gitleaks configuration for Slot Math Lab.
# Extends the built-in rules and allowlists specific files whose "api key" matches are
# content hashes / test fixtures, not secrets (SHA-256 fingerprints in generated reports).
# Allowlists cover exact committed files. New files remain scanned even when stored
# alongside generated reports. Add only reviewed non-secret fingerprints here.

[extend]
useDefault = true

[allowlist]
paths = [
  '''^docs/verification/lab-demo-(sampled|performance)\.json$''',
  # ── Verification reports (sha256 evidence/binary fingerprints) ──
  '''^docs/verification/advanced-measurements-production\.json$''',
  '''^docs/verification/cohort-collection-benchmark\.json$''',
  '''^docs/verification/component-accounting-production\.json$''',
  '''^docs/verification/interrupted-lifecycle-production\.json$''',
  '''^docs/verification/measurements-checks\.json$''',
  '''^docs/verification/measurements-local\.json$''',
  '''^docs/verification/measurements-production\.json$''',
  '''^docs/verification/metrics-coverage\.json$''',
  '''^docs/verification/metrics-research\.json$''',
  '''^docs/verification/native-experiments-production\.json$''',
  '''^docs/verification/numeric-input-production\.json$''',
  '''^docs/verification/performance-benchmark\.json$''',
  '''^docs/verification/performance-local\.json$''',
  '''^docs/verification/performance-production\.json$''',
  '''^docs/verification/realtime-production\.json$''',
  '''^docs/verification/record-values-production\.json$''',
  '''^docs/verification/results-checks\.json$''',
  '''^docs/verification/results-production\.json$''',
  '''^docs/verification/simulation-production-report\.json$''',
  '''^docs/verification/strict-expressions-production\.json$''',
  '''^docs/verification/validation-save-production\.json$''',
  '''^docs/verification/verification-profile-production\.json$''',
  '''^docs/verification/ws-negotiation-production\.json$''',
  '''^docs/verification/METRICS_IMPLEMENTATION\.md$''',
]
