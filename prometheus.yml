global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'slotmath-api'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:5152']
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
